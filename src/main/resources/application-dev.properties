# Development profile (default): demo data + dev-only endpoints.
spring.flyway.locations=classpath:db/migration,classpath:db/seed-demo
# Same fixed "today" as the front end (src/data/constants.js), so seeded eligibility results are stable.
petcare.reference-date=2026-08-17

# Verification codes are never returned to the browser or written to the console.
# Run with SPRING_PROFILES_ACTIVE=dev,email to deliver them through configured SMTP.
petcare.dev-return-codes=false
