# Optional SMTP profile for testing real email delivery while retaining the development database and demo data.
# Start with: SPRING_PROFILES_ACTIVE=dev,email
# Never put the Gmail password/app password in this file; provide it through environment variables.
spring.mail.host=${PETCARE_SMTP_HOST:smtp.gmail.com}
spring.mail.port=${PETCARE_SMTP_PORT:587}
spring.mail.username=${PETCARE_SMTP_USER:petcare.santarosa@gmail.com}
spring.mail.password=${PETCARE_SMTP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=${PETCARE_SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=${PETCARE_SMTP_STARTTLS:true}
spring.mail.test-connection=true

petcare.mail.from=${PETCARE_MAIL_FROM:petcare.santarosa@gmail.com}
petcare.mail.office-name=${PETCARE_MAIL_OFFICE_NAME:Santa Rosa City Veterinary Office}

# Real email mode must never expose OTPs in the response, page, or server output.
petcare.dev-return-codes=false
