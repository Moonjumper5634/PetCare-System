# Local PostgreSQL development profile. Activate with SPRING_PROFILES_ACTIVE=dev,postgresql.
spring.datasource.url=${PETCARE_DB_URL:jdbc:postgresql://localhost:5432/petcare}
spring.datasource.username=${PETCARE_DB_USER:petcare}
spring.datasource.password=${PETCARE_DB_PASSWORD:petcare}
spring.flyway.locations=classpath:db/postgresql-migration,classpath:db/postgresql-seed-demo

