# Production profile: schema + reference data only. No demo accounts, no dev endpoints, real date.
spring.flyway.locations=classpath:db/migration
petcare.reference-date=

# Required production database values. Startup fails when a required secret is absent.
spring.datasource.url=${PETCARE_DB_URL}
spring.datasource.username=${PETCARE_DB_USER}
spring.datasource.password=${PETCARE_DB_PASSWORD}

# SMTP delivery for sign-up and password-reset codes.
spring.mail.host=${PETCARE_SMTP_HOST}
spring.mail.port=${PETCARE_SMTP_PORT:587}
spring.mail.username=${PETCARE_SMTP_USER}
spring.mail.password=${PETCARE_SMTP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=${PETCARE_SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=${PETCARE_SMTP_STARTTLS:true}
spring.mail.test-connection=false
petcare.mail.from=${PETCARE_MAIL_FROM}
petcare.mail.office-name=${PETCARE_MAIL_OFFICE_NAME:Santa Rosa City Veterinary Office}
petcare.mail.notifications-enabled=${PETCARE_EMAIL_NOTIFICATIONS_ENABLED:false}

# The session cookie is only sent over HTTPS. Serve the site over HTTPS (or behind an HTTPS proxy) in production;
# if you test this profile on plain http://localhost the browser will not keep you signed in.
server.servlet.session.cookie.secure=true
petcare.dev-return-codes=false

# Correct client scheme/IP behind the included Caddy HTTPS proxy.
server.forward-headers-strategy=framework
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# Only a non-sensitive readiness endpoint is exposed.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.health.mail.enabled=false
management.info.env.enabled=true
info.app.name=PetCARE
info.app.phase=5

# Avoid disclosing framework details in error responses.
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
spring.web.resources.cache.cachecontrol.max-age=1h
